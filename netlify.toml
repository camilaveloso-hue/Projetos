# Publica só a pasta do site (as demais pastas do repositório são ferramentas e rascunhos).
[build]
  publish = "site-camila-veloso"
  command = ""

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Páginas removidas no enxugamento do site: quem tinha o link antigo cai na Home.
[[redirects]]
  from = "/o-diario-de-amelia/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/o-diario-de-amelia"
